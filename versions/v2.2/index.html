     * like background -- it owns a corner of the picture, or it covers a fifth
     * of the perimeter. An object poking through the edge is a short run of a
     * colour that owns no corner, so it seeds nothing and survives.
     *
     * Dropping a group is safe even when that group really was background:
     * seeds are only starting points, and the local-step walk still reaches
     * any background connected to some other seed.
     */
    const BG_SEED_MAX_CLUSTERS = 48;

    function backgroundSeeds(srcData, tolerance) {
      const w = srcData.width, h = srcData.height, src = srcData.data;
      const border = borderSeeds(w, h);
      if (border.length < 8) return border;

      const radius = Math.max(30, tolerance * 2);
      const r2 = radius * radius;
      const clusters = [];                       // { r, g, b, n, corner }
      const assign = new Int32Array(border.length);

      // "Corner" is a short run along both edges that meet there, not a single
      // pixel -- one hot pixel in a corner should not decide the whole photo.
      const corners = new Set();
      const cw = Math.max(1, Math.round(w * 0.04));
      const ch = Math.max(1, Math.round(h * 0.04));
      for (let d = 0; d < cw; d++) {
        corners.add(d); corners.add(w - 1 - d);
        corners.add((h - 1) * w + d); corners.add((h - 1) * w + w - 1 - d);
      }
      for (let d = 0; d < ch; d++) {
        corners.add(d * w); corners.add(d * w + w - 1);
        corners.add((h - 1 - d) * w); corners.add((h - 1 - d) * w + w - 1);
      }

      for (let k = 0; k < border.length; k++) {
        const i = border[k] << 2;
        const R = src[i], G = src[i + 1], B = src[i + 2];
        let found = -1, bestD = Infinity;
        for (let c = 0; c < clusters.length; c++) {
          const cl = clusters[c];
          const dr = R - cl.r, dg = G - cl.g, db = B - cl.b;
          const d = dr * dr + dg * dg + db * db;
          if (d <= r2) { found = c; break; }
          if (d < bestD) { bestD = d; }
        }
        if (found === -1) {
          if (clusters.length >= BG_SEED_MAX_CLUSTERS) {
            // Cap reached (a very noisy or heavily graded edge): fall back to
            // the nearest group rather than growing without bound.
            let near = 0, nd = Infinity;
            for (let c = 0; c < clusters.length; c++) {
              const cl = clusters[c];
              const dr = R - cl.r, dg = G - cl.g, db = B - cl.b;
              const d = dr * dr + dg * dg + db * db;
              if (d < nd) { nd = d; near = c; }
            }
            found = near;
          } else {
            clusters.push({ r: R, g: G, b: B, n: 0, corner: false });
            found = clusters.length - 1;
          }
        }
        clusters[found].n++;
        if (corners.has(border[k])) clusters[found].corner = true;
        assign[k] = found;
      }

      const accepted = clusters.map(c => c.corner || (c.n / border.length) >= 0.2);
      if (!accepted.some(Boolean)) return border;

      const seeds = [];
      for (let k = 0; k < border.length; k++) if (accepted[assign[k]]) seeds.push(border[k]);
      return seeds.length ? seeds : border;
    }

    /** Border flood at `tolerance`, despeckled. Returns a 0/255 hard mask. */
    function autoHardMask(srcData, tolerance) {
      const w = srcData.width, h = srcData.height, total = w * h;
      const hit = floodFrom(srcData, backgroundSeeds(srcData, tolerance), tolerance, undefined, null);
      const hard = new Uint8Array(total);
      for (let i = 0; i < total; i++) hard[i] = hit[i] ? 255 : 0;
      despeckleMask(hard, w, h, Math.max(12, Math.round(total * 0.0012)));
      pruneKeptFragments(hard, w, h);
      return hard;
    }

    /**
     * Drops surviving scraps that are tiny NEXT TO the thing that survived.
     *
     * Despeckling uses an absolute size, so it cannot tell a 900-pixel crumb
     * on a 0.8-megapixel photo from a small object deliberately photographed:
     * set it high enough to clear the crumbs and it starts eating real
     * subjects. Measuring each survivor against the largest survivor instead
     * is scale-free -- a photo of one object on a table comes back as that
     * object, and a genuinely small subject is safe because it IS the largest.
     *
     * Both bars have to be cleared: a scrap must be small relative to the
     * subject AND small in absolute terms, so a photo of two objects side by
     * side never loses one of them.
     */
    function pruneKeptFragments(hard, w, h) {
      const total = w * h;
      const { label, area } = labelComponents(hard, w, h);
      let largestKept = 0;
      for (let i = 0; i < total; i++) {
        if (hard[i] === 0) { const a = area[label[i]]; if (a > largestKept) largestKept = a; }
      }
      if (!largestKept) return;
      const relative = largestKept * 0.06;
      const absolute = total * 0.015;
      for (let i = 0; i < total; i++) {
        if (hard[i] !== 0) continue;
        const a = area[label[i]];
        if (a < relative && a < absolute) hard[i] = 255;
      }
    }

    function downscaleImageData(imgData, maxEdge) {
      const scale = Math.min(1, maxEdge / Math.max(imgData.width, imgData.height));
      if (scale >= 1) return imgData;
      const sw = Math.max(1, Math.round(imgData.width * scale));
      const sh = Math.max(1, Math.round(imgData.height * scale));
      const a = document.createElement('canvas');
      a.width = imgData.width; a.height = imgData.height;
      a.getContext('2d').putImageData(imgData, 0, 0);
      const b = document.createElement('canvas');
      b.width = sw; b.height = sh;
      const bx = b.getContext('2d');
      bx.imageSmoothingEnabled = true;
      bx.drawImage(a, 0, 0, sw, sh);
      return bx.getImageData(0, 0, sw, sh);
    }

    /** Mean neighbour-to-neighbour colour distance over the whole picture. */
    function meanGradient(imgData) {
      const w = imgData.width, h = imgData.height, d = imgData.data;
      let sum = 0, n = 0;
      for (let y = 0; y < h - 1; y++) {
        for (let x = 0; x < w - 1; x++) {
          const i = y * w + x, a = i << 2;
          let b = (i + 1) << 2;
          sum += Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
          b = (i + w) << 2;
          sum += Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
          n += 2;
        }
      }
      return n ? sum / n : 0;
    }

    /**
     * How hard the picture disagrees with itself along the cut.
     *
     * This is the measurement that catches a fill eating the subject, and
     * nothing else does. Removing a background leaves a cut that runs along
     * the object's outline, where the picture changes sharply. Eating into the
     * object leaves a cut running through skin, or a shirt, or a wall, where
     * the picture barely changes at all -- and every cheaper metric is blind
     * to it: the removed fraction looks reasonable, the middle of the frame
     * survives, and what is left is still one connected blob. Chris's selfie
     * in a dim room passed all three while the fill was taking his shirt, his
     * hair and half his face.
     *
     * Returned relative to the picture's own average gradient, so a flatly-lit
     * photo is judged on its own terms rather than against a sunny one.
     */
    function boundaryContrast(imgData, hit, avgGradient) {
      const w = imgData.width, h = imgData.height, d = imgData.data;
      let sum = 0, n = 0;
      for (let y = 0; y < h - 1; y++) {
        for (let x = 0; x < w - 1; x++) {
          const i = y * w + x;
          if (hit[i] !== hit[i + 1]) {
            const a = i << 2, b = (i + 1) << 2;
            sum += Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
            n++;
          }
          if (hit[i] !== hit[i + w]) {
            const a = i << 2, b = (i + w) << 2;
            sum += Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
            n++;
          }
        }
      }
      if (!n) return 0;
      return (sum / n) / Math.max(1, avgGradient);
    }

    /**
     * Picks the tolerance the photo actually wants, instead of making the user
     * hunt for it. Every candidate is scored on a thumbnail against four
     * things that describe a good cut-out and cost nothing to measure: the
     * frame edge came out clean, the middle of the picture survived, plenty
     * was removed, and what survived is one object rather than debris. The
     * band checks reject the two degenerate answers (removed nothing, removed
     * everything) before scoring, so the score never has to defend against
     * them. Returns a tolerance for the slider.
     */
    function pickAutoAmount(srcData) {
      const small = downscaleImageData(srcData, 220);
      const sw = small.width, sh = small.height, total = sw * sh;
      const perimeter = borderSeeds(sw, sh);
      const cx0 = Math.floor(sw * 0.3), cx1 = Math.max(cx0 + 1, Math.ceil(sw * 0.7));
      const cy0 = Math.floor(sh * 0.3), cy1 = Math.max(cy0 + 1, Math.ceil(sh * 0.7));
      const kx0 = Math.floor(sw * 0.42), kx1 = Math.max(kx0 + 1, Math.ceil(sw * 0.58));
      const ky0 = Math.floor(sh * 0.42), ky1 = Math.max(ky0 + 1, Math.ceil(sh * 0.58));
      const candidates = [8, 11, 14, 18, 22, 26, 31, 37, 44, 52, 62, 74];

      const avgGradient = meanGradient(small);
      let best = 26, bestScore = -Infinity, sawAny = false;
      let bestStats = null;

      for (const tol of candidates) {
        const seeds = backgroundSeeds(small, tol);
        const hit = floodFrom(small, seeds, tol, undefined, null);
        let removed = 0;
        for (let i = 0; i < total; i++) if (hit[i]) removed++;
        const frac = removed / total;
        if (frac < 0.12 || frac > 0.985) continue;   // removed nothing / everything

        // The middle of the frame is a GATE, never a reward. Scoring it was
        // the bug that made every photo pick the gentlest setting: a pass that
        // removes nothing leaves the centre untouched and so scored highest
        // for doing nothing at all. It can only veto a candidate that has
        // clearly chewed into the subject.
        let centerKept = 0, centerTotal = 0;
        for (let y = cy0; y < cy1; y++) {
          for (let x = cx0; x < cx1; x++) {
            centerTotal++;
            if (!hit[y * sw + x]) centerKept++;
          }
        }
        const centerFrac = centerTotal ? centerKept / centerTotal : 0;
        if (centerFrac < 0.45) continue;

        let coreKept = 0, coreTotal = 0;
        for (let y = ky0; y < ky1; y++) {
          for (let x = kx0; x < kx1; x++) {
            coreTotal++;
            if (!hit[y * sw + x]) coreKept++;
          }
        }
        if (coreTotal && coreKept / coreTotal < 0.8) continue;   // ate the core

        // Scored against the WHOLE perimeter, not just the seeded part --
        // otherwise dropping seeds would flatter the score for free.
        let borderRemoved = 0;
        for (let k = 0; k < perimeter.length; k++) if (hit[perimeter[k]]) borderRemoved++;
        const borderFrac = borderRemoved / perimeter.length;

        const km = new Uint8Array(total);
        for (let i = 0; i < total; i++) km[i] = hit[i] ? 255 : 0;
        const { label, area } = labelComponents(km, sw, sh);
        let largestKept = 0, keptTotal = 0;
        for (let i = 0; i < total; i++) {
          if (!hit[i]) { keptTotal++; const a = area[label[i]]; if (a > largestKept) largestKept = a; }
        }
        const compact = keptTotal ? largestKept / keptTotal : 0;

        // What a good cut-out actually looks like: the frame edge came out
        // clean, plenty was removed, and what survived is one object rather
        // than debris. `>=` breaks ties toward the larger tolerance -- on a
        // plateau every setting yields the same mask, and the looser one is
        // the more robust choice at full resolution.
        // Normalised so the term still has room to move at the top of its
        // range: real cuts run 3-10x the picture's average gradient, so
        // dividing by 3 pinned every candidate at 1.0 and the term did
        // nothing at all. On Chris's selfie the ratio peaks at 9.25 and then
        // collapses to 5.24 at exactly the setting where the fill breaks out
        // of the background and into his shirt -- that collapse is the whole
        // signal, and it is only visible unsaturated.
        const contrast = boundaryContrast(small, hit, avgGradient);
        const edgeFit = Math.min(1, contrast / 10);

        const score = 1.6 * borderFrac + 1.4 * frac + 0.9 * compact + 1.8 * edgeFit;
        sawAny = true;
        if (score >= bestScore) {
          bestScore = score;
          best = tol;
          bestStats = { frac: frac, compact: compact, edgeFit: edgeFit, contrast: contrast };
        }
      }

      // Nothing scored: a photo with no separable background (a close-up that
      // fills the frame). The gentlest setting is the least destructive answer.
      return sawAny ? best : 12;
    }

    const ED_AUTO_CANDIDATES = [8, 11, 14, 18, 22, 26, 31, 37, 44, 52, 62, 74];

    /**
     * Scores a finished full-resolution mask, and decides whether it is good
     * enough to apply without being asked.
     *
     * The thumbnail search cannot make this call. Downscaling averages away
     * the sensor noise that the fill actually has to walk through, so a
     * setting that looks clean at 220px can be the setting that walks straight
     * through a dark shirt at full size -- on Chris's selfie the thumbnail
     * liked 44 while the full-resolution optimum was 31, and 44 is exactly
     * where his shirt and hair disappear. So the thumbnail only proposes a
     * neighbourhood and every real decision is made on the real mask.
     */
    function edScoreHard(hard, avgGradient) {
      const w = ED.w, h = ED.h, total = w * h;
      let removed = 0;
      for (let i = 0; i < total; i++) if (hard[i] > 127) removed++;
      const frac = removed / total;

      const perimeter = borderSeeds(w, h);
      let borderRemoved = 0;
      for (let k = 0; k < perimeter.length; k++) if (hard[perimeter[k]] > 127) borderRemoved++;
      const borderFrac = borderRemoved / perimeter.length;

      const { label, area } = labelComponents(hard, w, h);
      let largestKept = 0, kept = 0;
      for (let i = 0; i < total; i++) {
        if (hard[i] === 0) { kept++; const a = area[label[i]]; if (a > largestKept) largestKept = a; }
      }
      const compact = kept ? largestKept / kept : 0;
      const edgeFit = Math.min(1, boundaryContrast(ED.src, hard, avgGradient) / 10);

      const usable = frac >= 0.08 && frac <= 0.985;
      return {
        frac: frac, compact: compact, edgeFit: edgeFit,
        score: usable ? (1.6 * borderFrac + 1.4 * frac + 0.9 * compact + 1.8 * edgeFit) : -Infinity,
        /*
         * Some photos have no separable subject at all -- a street seen
         * through a car window, a cluttered room. The pass still returns its
         * best answer and the best answer is a nearly blank frame. Opening
         * onto that is worse than opening onto the untouched photo, so the
         * cut is computed either way and simply not applied until asked for.
         */
        /*
         * The removed fraction is a weak signal and a bad gate: a small object
         * on a big table legitimately removes 90% of the frame, and bars tight
         * enough to reject a failure were rejecting perfectly good cuts. What
         * actually separates them is whether one object survived (`compact`)
         * and whether the cut follows edges the picture really has
         * (`edgeFit`); the fraction is kept only as a sanity limit.
         */
        confident: usable && frac < 0.97 && compact > 0.65 && edgeFit > 0.45
      };
    }

    /**
     * Runs the automatic pass properly: a cheap thumbnail search for the
     * neighbourhood, then a handful of real full-resolution passes around it,
     * scored on the mask the user is actually going to see. The trials step
     * DOWNWARD from the guess because the thumbnail systematically over-
     * estimates -- smoothing hides the noise that makes a loose setting
     * dangerous, so the guess is an upper bound rather than an answer.
     */
    function edAutoBestMask() {
      const guess = pickAutoAmount(ED.src);
      const avgGradient = meanGradient(ED.src);

      let idx = ED_AUTO_CANDIDATES.indexOf(guess);
      if (idx < 0) {
        idx = 0;
        for (let i = 0; i < ED_AUTO_CANDIDATES.length; i++) {
          if (Math.abs(ED_AUTO_CANDIDATES[i] - guess) < Math.abs(ED_AUTO_CANDIDATES[idx] - guess)) idx = i;
        }
      }

      // Adjacent steps, not every other one. A sparse ladder skipped the right
      // answer outright: on a photo of a pill bottle held in a hand the guess
      // was 31 and the correct setting was 26, but the trials ran 31, 22, 14
      // and the best of those took the hand and the label with it. One step up
      // is included because the thumbnail only USUALLY over-estimates.
      const tried = new Set();
      let best = null;
      for (const step of [-1, 0, 1, 2]) {
        const t = ED_AUTO_CANDIDATES[Math.min(ED_AUTO_CANDIDATES.length - 1, Math.max(0, idx - step))];
        if (tried.has(t)) continue;
        tried.add(t);
        const hard = autoHardMask(ED.src, t);
        const stats = edScoreHard(hard, avgGradient);
        if (!best || stats.score > best.stats.score) best = { amount: t, hard: hard, stats: stats };
      }
      return best;
    }

    /* -------------------------- editor state -------------------------- */

    function edPushUndo() {
      // `subject` rides along because the crop resizes it: without it, undoing
      // a crop restores the full-size photo while leaving the cropped matte in
      // place, and the next touch of the slider reads off the end of it.
      ED.undo.push({ w: ED.w, h: ED.h, src: ED.src, hard: Uint8Array.from(ED.hard), subject: ED.subject });
      if (ED.undo.length > ED_UNDO_LIMIT) ED.undo.shift();
      edUpdateControls();
    }

    function edUndo() {
      const prev = ED.undo.pop();
      if (!prev) { showToast('Nothing to undo', 'error'); return; }
      ED.w = prev.w; ED.h = prev.h; ED.src = prev.src; ED.hard = prev.hard;
      ED.subject = prev.subject;
      capturedImageData = ED.src;
      captureWidth = ED.w; captureHeight = ED.h;
      edRebuildMask();
      edRender();
      edUpdateControls();
    }

    /** Re-runs the automatic pass at the current amount, dropping hand edits. */
    function edReset() {
      if (!ED.src) return;
      edPushUndo();
      edRunAuto(ED.amount);
    }

    function edRunAuto(amount) {
      if (!ED.src) return;
      ED.amount = amount;
      if (ED.engine === 'ai' && ED.subject && ED.subject.length === ED.w * ED.h) {
        // Re-cutting the model's matte at a new threshold is a pass over one
        // array, so the slider stays live under the finger. Re-running the
        // colour fill here instead would silently throw the model's answer
        // away the first time the user touched the slider.
        ED.hard = segThresholdToHard(ED.subject, ED.w, ED.h, amount);
        pruneKeptFragments(ED.hard, ED.w, ED.h);
      } else {
        ED.hard = autoHardMask(ED.src, amount);
      }
      // Once the user has driven the slider themselves, the editor's own
      // opinion of the automatic pass is no longer what is on screen.
      ED.autoConfident = true;
      edRebuildMask();
      edRender();
    }

    function edRebuildMask() {
      ED.mask = softenMask(ED.hard, ED.w, ED.h);
    }

    /* --------------------------- rendering ---------------------------- */

    function edComposite() {
      const total = ED.w * ED.h;
      const src = ED.src.data;
      if (!ED.out || ED.out.length !== total * 4) ED.out = new Uint8ClampedArray(total * 4);
      const out = ED.out;
      const fc = BG_FILLS[ED.fill];

      if (!fc) {
        out.set(src);
        return new ImageData(out, ED.w, ED.h);
      }
      const fr = fc[0], fg = fc[1], fb = fc[2];
      const mask = ED.mask;
      for (let i = 0; i < total; i++) {
        const a = mask[i] / 255, ia = 1 - a, j = i << 2;
        out[j]     = src[j]     * ia + fr * a;
        out[j + 1] = src[j + 1] * ia + fg * a;
        out[j + 2] = src[j + 2] * ia + fb * a;
        out[j + 3] = 255;
      }
      return new ImageData(out, ED.w, ED.h);
    }

    function edRender() {
      if (!ED.src) return;
      const canvas = document.getElementById('camera-fs-canvas');
      if (!canvas) return;
      if (canvas.width !== ED.w || canvas.height !== ED.h) {
        canvas.width = ED.w;
        canvas.height = ED.h;
      }
      canvas.getContext('2d').putImageData(edComposite(), 0, 0);
      edApplyTransform();
    }

    function edApplyTransform() {
      const canvas = document.getElementById('camera-fs-canvas');
      if (!canvas) return;
      canvas.style.transform =
        'translate(' + ED.panX + 'px,' + ED.panY + 'px) scale(' + ED.zoom + ')';
    }

    /* ------------------------ coordinate mapping ---------------------- */

    /**
     * Screen point -> source pixel. Read off the canvas's own bounding box,
     * which already includes the zoom/pan transform, then undo the letterbox
     * that `object-fit: contain` adds inside it. Doing it this way means the
     * transform can change without the hit-testing knowing anything about it.
     */
    function edToSource(clientX, clientY) {
      const canvas = document.getElementById('camera-fs-canvas');
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(rect.width / ED.w, rect.height / ED.h);
      if (!(scale > 0)) return null;
      const dw = ED.w * scale, dh = ED.h * scale;
      const ox = rect.left + (rect.width - dw) / 2;
      const oy = rect.top + (rect.height - dh) / 2;
      return {
        x: (clientX - ox) / scale,
        y: (clientY - oy) / scale,
        scale: scale
      };
    }

    function edInBounds(p) {
      return p && p.x >= 0 && p.y >= 0 && p.x < ED.w && p.y < ED.h;
    }

    /* ---------------------------- editing ----------------------------- */

    /**
     * Tap a patch. Erase floods the colour region under the finger and removes
     * it; restore floods the region and puts it back. Each is limited to
     * pixels that are currently on the other side, so a tap can never undo
     * itself and repeated taps converge. This is the tool that fixes both of
     * the automatic pass's failure modes -- a background patch it missed, and
     * a subject it ate because the subject touches the frame.
     */
    function edTapAt(sx, sy) {
      if (!ED.src) return;
      const x = Math.round(sx), y = Math.round(sy);
      if (x < 0 || y < 0 || x >= ED.w || y >= ED.h) return;
      const seed = y * ED.w + x;
      const erase = ED.tool === 'erase';
      const hard = ED.hard;
      const allow = erase ? (k => hard[k] === 0) : (k => hard[k] !== 0);

      if (!allow(seed)) {
        showToast(erase ? 'Already removed there' : 'That part is already kept', 'error');
        return;
      }

      const tol = edTapTolerance();
      const hit = floodFrom(ED.src, [seed], tol, tol * TAP_DRIFT_MULTIPLIER, allow);
      let n = 0;
      for (let i = 0; i < hit.length; i++) if (hit[i]) n++;
      if (!n) return;

      edPushUndo();
      const value = erase ? 255 : 0;
      for (let i = 0; i < hit.length; i++) if (hit[i]) hard[i] = value;
      edRebuildMask();
      edRender();
      showToast((erase ? 'Removed ' : 'Restored ') + Math.round(100 * n / (ED.w * ED.h)) + '% of the photo', 'success');
    }

    /*
     * A tap has to be far more cautious than the whole-frame pass, and the
     * reason is the leash rather than the tolerance. The frame pass can afford
     * a 3x drift because it starts from the frame edge and is walking real
     * background; a tap starts wherever the finger landed, and the ramp of
     * blended pixels along an object's outline is a chain of small steps that
     * a loose leash will happily follow straight through the object. One tap
     * on the hole in a mug handle took the entire mug with it before this was
     * tightened. Undo covers a tap that overreaches, but a tap that eats the
     * picture is not a tool anyone trusts twice.
     */
    const TAP_DRIFT_MULTIPLIER = 1.6;

    function edTapTolerance() {
      return Math.min(40, Math.max(14, Math.round(ED.amount * 0.6)));
    }

    /** Paints a disc into the hard mask. */
    function edPaintDisc(cx, cy, r, value) {
      const w = ED.w, h = ED.h, hard = ED.hard;
      const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(w - 1, Math.ceil(cx + r));
      const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(h - 1, Math.ceil(cy + r));
      const r2 = r * r;
      for (let y = y0; y <= y1; y++) {
        const dy = y - cy, dy2 = dy * dy, row = y * w;
        for (let x = x0; x <= x1; x++) {
          const dx = x - cx;
          if (dx * dx + dy2 <= r2) hard[row + x] = value;
        }
      }
    }

    /** Paints the segment between two points so a fast drag has no gaps. */
    function edPaintSegment(ax, ay, bx, by, r, value) {
      const dx = bx - ax, dy = by - ay;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const steps = Math.max(1, Math.ceil(dist / Math.max(1, r * 0.4)));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        edPaintDisc(ax + dx * t, ay + dy * t, r, value);
      }
    }

    /* --------------------------- crop --------------------------------- */

    /**
     * Crops to what survived, with a margin. A tile is a small square on a
     * board -- an object photographed from across a table reads as a dot
     * until it is cropped, and doing it after the cut-out means the crop can
     * use the mask instead of guessing.
     */
    function edCropToSubject() {
      if (!ED.src) return;
      const w = ED.w, h = ED.h, hard = ED.hard;
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
          if (hard[row + x] === 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < minX || maxY < minY) { showToast('Nothing left to crop to', 'error'); return; }

      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      if (bw > w * 0.94 && bh > h * 0.94) { showToast('Already filling the frame', 'success'); return; }

      const pad = Math.round(Math.max(bw, bh) * 0.06) + 2;
      const x0 = Math.max(0, minX - pad), y0 = Math.max(0, minY - pad);
      const x1 = Math.min(w - 1, maxX + pad), y1 = Math.min(h - 1, maxY + pad);
      const nw = x1 - x0 + 1, nh = y1 - y0 + 1;

      edPushUndo();

      const a = document.createElement('canvas');
      a.width = w; a.height = h;
      a.getContext('2d').putImageData(ED.src, 0, 0);
      const b = document.createElement('canvas');
      b.width = nw; b.height = nh;
      const bx = b.getContext('2d');
      bx.drawImage(a, x0, y0, nw, nh, 0, 0, nw, nh);

      const nextHard = new Uint8Array(nw * nh);
      for (let y = 0; y < nh; y++) {
        for (let x = 0; x < nw; x++) nextHard[y * nw + x] = hard[(y + y0) * w + (x + x0)];
      }

      // The model's matte is indexed by the old dimensions, so it has to be
      // cropped to match or the slider re-cuts against the wrong geometry.
      let nextSubject = null;
      if (ED.subject && ED.subject.length === w * h) {
        nextSubject = new Float32Array(nw * nh);
        for (let y = 0; y < nh; y++) {
          for (let x = 0; x < nw; x++) nextSubject[y * nw + x] = ED.subject[(y + y0) * w + (x + x0)];
        }
      }

      ED.src = bx.getImageData(0, 0, nw, nh);
      ED.hard = nextHard;
      ED.subject = nextSubject;
      ED.w = nw; ED.h = nh;
      capturedImageData = ED.src;
      captureWidth = nw; captureHeight = nh;
      ED.zoom = 1; ED.panX = 0; ED.panY = 0;
      ED.out = null;
      edRebuildMask();
      edRender();
      edUpdateControls();
      showToast('Cropped to the subject', 'success');
    }

    /* --------------------------- controls ----------------------------- */

    function edSetFill(mode) {
      ED.fill = (mode === 'white' || mode === 'black') ? mode : 'none';
      bgFillMode = (ED.fill === 'none') ? null : ED.fill;
      edRender();
      edUpdateControls();
    }

    function edSetTool(tool) {
      ED.tool = (tool === 'restore') ? 'restore' : 'erase';
      edUpdateControls();
    }

    function edOnBrushInput() {
      const slider = document.getElementById('bgx-brush');
      const value = slider ? parseInt(slider.value, 10) : 40;
      ED.brush = Number.isFinite(value) ? value : 40;
      const label = document.getElementById('bgx-brush-value');
      if (label) label.textContent = String(ED.brush);
      edFlashBrushRing();
    }

    /** Shows the brush footprint for a moment when the size changes. */
    function edFlashBrushRing() {
      const ring = document.getElementById('bgx-brush-ring');
      const stage = document.getElementById('bgx-stage');
      const canvas = document.getElementById('camera-fs-canvas');
      if (!ring || !stage || !canvas || !ED.src) return;
      const rect = canvas.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const scale = Math.min(rect.width / ED.w, rect.height / ED.h);
      const d = Math.max(6, ED.brush * 2 * scale);
      ring.style.width = d + 'px';
      ring.style.height = d + 'px';
      ring.style.left = (stageRect.width / 2) + 'px';
      ring.style.top = (stageRect.height / 2) + 'px';
      ring.style.display = 'block';
      clearTimeout(edFlashBrushRing._t);
      edFlashBrushRing._t = setTimeout(() => { ring.style.display = 'none'; }, 900);
    }

    function edUpdateControls() {
      const mark = (id, on) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('active-fill', !!on);
      };
      mark('btn-bg-white', ED.fill === 'white');
      mark('btn-bg-black', ED.fill === 'black');
      mark('btn-bg-none', ED.fill === 'none');
      mark('bgx-tool-erase', ED.tool === 'erase');
      mark('bgx-tool-restore', ED.tool === 'restore');

      const undoBtn = document.getElementById('bgx-btn-undo');
      if (undoBtn) undoBtn.disabled = ED.undo.length === 0;

      // Until an engine has produced a mask there is nothing for the amount
      // slider or Reset to act on, and letting them run in that window meant
      // a stray touch could take over the photo and cancel the model that was
      // about to answer.
      const amountSlider = document.getElementById('wb-tolerance');
      if (amountSlider) amountSlider.disabled = !!ED.thinking;
      const resetBtn = document.getElementById('bgx-btn-reset');
      if (resetBtn) resetBtn.disabled = !!ED.thinking;

      const brushRow = document.getElementById('bgx-brush-row');
      if (brushRow) brushRow.style.display = '';

      // The slider means two different things depending on which engine
      // produced the mask, so it says which.
      const amountLabel = document.getElementById('bgx-amount-label');
      if (amountLabel) {
        amountLabel.textContent = (ED.engine === 'ai')
          ? 'Trim around the subject'
          : 'How much background to remove';
      }

      const hint = document.getElementById('bgx-hint');
      if (hint) {
        hint.textContent = ED.thinking
          ? 'Finding the subject in your photo…'
          : (ED.autoConfident === false && ED.fill === 'none')
            ? 'No clear subject found — tap White or Black to apply anyway'
            : (ED.tool === 'erase')
              ? 'Tap a patch to remove it · drag to paint it out · pinch to zoom'
              : 'Tap a removed patch to bring it back · drag to paint it back';
      }
    }

    /* ---------------------- pointer interaction ----------------------- */

    const edPointers = new Map();
    let edStroke = null;
    let edPinch = null;
    let edRenderQueued = false;

    function edQueueRender() {
      if (edRenderQueued) return;
      edRenderQueued = true;
      requestAnimationFrame(() => {
        edRenderQueued = false;
        edRebuildMask();
        edRender();
      });
    }

    function edWireStage() {
      if (ED.wired) return;
      const stage = document.getElementById('bgx-stage');
      if (!stage) return;
      ED.wired = true;

      stage.addEventListener('pointerdown', (e) => {
        if (!ED.src) return;
        /*
         * Capture keeps a stroke alive when the finger slides off the stage,
         * which is a convenience -- but this WebView throws NotFoundError for
         * a pointer it does not consider active, and an exception here aborts
         * the rest of the handler. That means no stroke is started and the
         * pointer is never registered, so erase, restore, tap and pinch all
         * go silently dead. A nicety must not be able to kill every tool.
         */
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
        edPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (edPointers.size === 2) {
          // A second finger turns the gesture into zoom/pan. Any stroke the
          // first finger had begun is rolled back, so pinching never leaves
          // a stray smear behind.
          if (edStroke && edStroke.painted) edUndo();
          edStroke = null;
          const pts = [...edPointers.values()];
          edPinch = {
            dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
            zoom: ED.zoom,
            mid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 },
            panX: ED.panX, panY: ED.panY
          };
          return;
        }
        if (edPointers.size > 2) return;

        const p = edToSource(e.clientX, e.clientY);
        edStroke = { start: { x: e.clientX, y: e.clientY }, src: p, moved: false, painted: false };
      });

      stage.addEventListener('pointermove', (e) => {
        if (!ED.src || !edPointers.has(e.pointerId)) return;
        edPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (edPinch && edPointers.size >= 2) {
          const pts = [...edPointers.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          ED.zoom = Math.min(8, Math.max(1, edPinch.zoom * (dist / (edPinch.dist || 1))));
          ED.panX = edPinch.panX + (mid.x - edPinch.mid.x);
          ED.panY = edPinch.panY + (mid.y - edPinch.mid.y);
          if (ED.zoom <= 1.01) { ED.zoom = 1; ED.panX = 0; ED.panY = 0; }
          edApplyTransform();
          return;
        }

        if (!edStroke) return;
        const dx = e.clientX - edStroke.start.x, dy = e.clientY - edStroke.start.y;
        if (!edStroke.moved && Math.hypot(dx, dy) < 7) return;   // still a tap

        const p = edToSource(e.clientX, e.clientY);
        if (!p) return;
        if (!edStroke.moved) {
          edStroke.moved = true;
          edPushUndo();
          edStroke.painted = true;
        }
        const value = ED.tool === 'erase' ? 255 : 0;
        const from = edStroke.src && edInBounds(edStroke.src) ? edStroke.src : p;
        edPaintSegment(from.x, from.y, p.x, p.y, ED.brush, value);
        edStroke.src = p;
        edQueueRender();
      });

      const finish = (e) => {
        if (!edPointers.has(e.pointerId)) return;
        edPointers.delete(e.pointerId);
        if (edPointers.size < 2) edPinch = null;
        if (edPointers.size > 0) return;

        if (edStroke && !edStroke.moved && edStroke.src && edInBounds(edStroke.src)) {
          edTapAt(edStroke.src.x, edStroke.src.y);
        } else if (edStroke && edStroke.moved) {
          edRebuildMask();
          edRender();
        }
        edStroke = null;
        edUpdateControls();
      };
      stage.addEventListener('pointerup', finish);
      stage.addEventListener('pointercancel', finish);
    }

    /* ---------------- entry points used by the rest of the app -------- */

    /*
     * Loads any source -- a live video frame or an image already on the tile --
     * into the editor, capped on the long edge so every pass stays instant on
     * a phone, then runs the automatic cut immediately. Opening the editor and
     * seeing the finished cut-out, rather than the raw photo and a slider to
     * go hunting with, is the whole point.
     */
    function loadSourceIntoEditor(source, srcW, srcH) {
      const vw = srcW || 640;
      const vh = srcH || 480;
      const scale = Math.min(1, ED_MAX_EDGE / Math.max(vw, vh));
      captureWidth = Math.max(1, Math.round(vw * scale));
      captureHeight = Math.max(1, Math.round(vh * scale));

      const canvas = document.getElementById('camera-fs-canvas');
      canvas.width = captureWidth;
      canvas.height = captureHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(source, 0, 0, captureWidth, captureHeight);

      ED.src = ctx.getImageData(0, 0, captureWidth, captureHeight);
      ED.w = captureWidth;
      ED.h = captureHeight;
      ED.undo = [];
      ED.out = null;
      ED.zoom = 1; ED.panX = 0; ED.panY = 0;
      ED.tool = 'erase';
      ED.engine = 'colour';
      ED.subject = null;
      ED.loadToken++;
      ED.brush = Math.max(12, Math.round(Math.min(ED.w, ED.h) * 0.06));

      capturedImageData = ED.src;   // kept for callers that predate the mask

      const brushSlider = document.getElementById('bgx-brush');
      if (brushSlider) {
        brushSlider.max = String(Math.max(40, Math.round(Math.min(ED.w, ED.h) * 0.35)));
        brushSlider.value = String(ED.brush);
      }
      const brushLabel = document.getElementById('bgx-brush-value');
      if (brushLabel) brushLabel.textContent = String(ED.brush);

      edWireStage();

      /*
       * Find the SUBJECT first; the background is whatever is left over.
       *
       * This used to run the other way round -- hunt for the background by
       * flooding inward from the frame edge and call whatever survived the
       * subject -- and that is precisely why it could take a person's dark
       * shirt: it never knew there was a person there. The model is asked
       * first now, and the colour pass is what happens when there is no model,
       * not what happens first by default.
       *
       * Nothing half-cut is shown while the model thinks. The photo stays as
       * it was shot, with a note saying what is happening, because an answer
       * that appears instantly and then changes under you reads as a glitch
       * even when the second answer is the better one.
       */
      if (window.TT_AI.enabled && SEG.status !== 'unavailable') {
        ED.thinking = true;
        ED.hard = new Uint8Array(ED.w * ED.h);   // nothing removed yet
        ED.fill = 'none';
        bgFillMode = null;
        ED.autoConfident = null;
        ED.amount = 50;
        edSyncAmountSlider();
        edRebuildMask();
        edRender();
        edUpdateControls();
        segRefineEditor(ED.loadToken);
      } else {
        ED.thinking = false;
        edRunColourAuto();
      }
    }

    function edSyncAmountSlider() {
      const slider = document.getElementById('wb-tolerance');
      if (slider) slider.value = String(ED.amount);
      const label = document.getElementById('wb-tolerance-value');
      if (label) label.textContent = String(ED.amount);
    }

    /**
     * The colour pass, as a fallback. Used when there is no model -- and only
     * then. It cannot know what an object is, so it is the answer of last
     * resort rather than the first thing tried.
     */
    function edRunColourAuto() {
      if (!ED.src) return;
      ED.thinking = false;
      const pick = edAutoBestMask();
      ED.engine = 'colour';
      ED.subject = null;
      ED.amount = pick.amount;
      ED.fill = pick.stats.confident ? 'white' : 'none';
      bgFillMode = pick.stats.confident ? 'white' : null;
      ED.autoConfident = pick.stats.confident;
      ED.hard = pick.hard;
      edSyncAmountSlider();
      edRebuildMask();
      edRender();
      edUpdateControls();
      if (!pick.stats.confident) {
        showToast('No clear subject found — tap White, or erase by hand', 'error');
      }
      console.log('[TT] colour cut ' + ED.w + 'x' + ED.h + ' amount=' + ED.amount +
        ' confident=' + pick.stats.confident);
    }

    function capturePhoto() {
      const videoEl = document.getElementById('camera-fs-video');
      if (!videoEl || !cameraStream) {
        showToast('Camera is not running', 'error');
        return;
      }
      loadSourceIntoEditor(videoEl, videoEl.videoWidth, videoEl.videoHeight);
      console.log('[TT] captured ' + captureWidth + 'x' + captureHeight);
      stopCamera();
      showCameraEditorLayer();
    }

    /*
     * Opens the editor on the photo the tile already has -- uploaded from the
     * gallery, or shot earlier and saved. Background removal is a property of
     * the tile picture, not of the camera.
     */
    function editPendingPhoto() {
      if (!pendingPhotoBlob) {
        showToast('No photo to edit yet', 'error');
        return;
      }
      // Drop the previous photo before the layer goes up. Decoding is async,
      // so without this the editor opens showing the LAST picture it edited
      // until the new one arrives -- and any tap in that window would be
      // acting on a mask that belongs to a different photo.
      ED.src = null; ED.hard = null; ED.mask = null; ED.undo = [];
      capturedImageData = null;

      const url = URL.createObjectURL(pendingPhotoBlob);
      const img = new Image();
      img.onload = () => {
        photoEditorSource = 'existing';
        openCameraFullscreen();
        showCameraEditorLayer();
        loadSourceIntoEditor(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
        console.log('[TT] editing existing photo ' + captureWidth + 'x' + captureHeight);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        showToast('Could not open that image', 'error');
      };
      img.src = url;
    }

    function retakePhoto() {
      ED.src = null; ED.hard = null; ED.mask = null; ED.undo = [];
      capturedImageData = null;
      bgFillMode = null;
      photoEditorSource = 'camera';
      showCameraLiveLayer();
      startCameraStream();
    }

    /* ------------- compatibility shims (older call sites) ------------- */

    /**
     * Pure one-shot version of the whole pipeline: border flood, despeckle,
     * soften, composite. Returns a new ImageData and never mutates the input.
     */
    function fillBackground(srcData, tolerance, fillRgb, driftLimit) {
      const fill = fillRgb || [255, 255, 255];
      const w = srcData.width, h = srcData.height, total = w * h;
      const hit = floodFrom(srcData, backgroundSeeds(srcData, tolerance), tolerance, driftLimit, null);
      const hard = new Uint8Array(total);
      for (let i = 0; i < total; i++) hard[i] = hit[i] ? 255 : 0;
      despeckleMask(hard, w, h, Math.max(12, Math.round(total * 0.0012)));
      const soft = softenMask(hard, w, h);

      const src = srcData.data;
      const out = new Uint8ClampedArray(src);
      for (let i = 0; i < total; i++) {
        const a = soft[i] / 255, ia = 1 - a, j = i << 2;
        out[j]     = src[j]     * ia + fill[0] * a;
        out[j + 1] = src[j + 1] * ia + fill[1] * a;
        out[j + 2] = src[j + 2] * ia + fill[2] * a;
        out[j + 3] = 255;
      }
      return new ImageData(out, w, h);
    }

    function whitenBackground(srcData, tolerance, driftLimit) {
      return fillBackground(srcData, tolerance, [255, 255, 255], driftLimit);
    }

    function currentTolerance() {
      const slider = document.getElementById('wb-tolerance');
      const value = slider ? parseInt(slider.value, 10) : 28;
      return Number.isFinite(value) ? value : 28;
    }

    function applyBackgroundFill(mode) {
      if (!ED.src) return;
      if (!BG_FILLS[mode]) return;
      edSetFill(mode);
    }

    function applyWhiteBackground() { applyBackgroundFill('white'); }

    function undoBackgroundFill() { edSetFill('none'); }

    function undoWhiteBackground() { undoBackgroundFill(); }

    function updateBgFillButtons() { edUpdateControls(); }

    /**
     * The amount slider re-runs the automatic pass. Hand edits are rebuilt
     * from scratch by that pass, so the previous state goes on the undo stack
     * first -- dragging the slider is never a way to silently lose brushwork.
     */
    function onToleranceInput() {
      const value = currentTolerance();
      const label = document.getElementById('wb-tolerance-value');
      if (label) label.textContent = String(value);
      if (!ED.src) { ED.amount = value; return; }
      if (!onToleranceInput._undoPushed) {
        edPushUndo();
        onToleranceInput._undoPushed = true;
        clearTimeout(onToleranceInput._t);
      }
      clearTimeout(onToleranceInput._t);
      onToleranceInput._t = setTimeout(() => { onToleranceInput._undoPushed = false; }, 900);
      edRunAuto(value);
      edUpdateControls();
    }

    function saveCapturedToTile() {
      const canvas = document.getElementById('camera-fs-canvas');
      if (!ED.src) {
        showToast('Nothing to save', 'error');
        return;
      }
      // Published before the conversion finishes so the tile editor's own
      // Save can wait for it rather than racing it.
      pendingPhotoWrite = new Promise((resolve) => {
        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('Could not save photo', 'error');
            resolve();
            return;
          }
          // Same hand-off as every other photo source: the editor's Save
          // button writes pendingPhotoBlob to IndexedDB.
          pendingPhotoBlob = blob;
          closeCameraFullscreen();
          updateModalPhotoPreview();
          showToast('Photo added — tap Save to store it', 'success');
          resolve();
        }, 'image/jpeg', 0.92);
      });
      return pendingPhotoWrite;
    }

    function triggerFileInput() {
      const fileInput = document.getElementById('photo-file-input');
      fileInput.value = '';
      fileInput.click();
    }

    function handleFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      pendingPhotoBlob = file;
      updateModalPhotoPreview();
      showToast('Image loaded', 'success');
    }

    function removePhoto() {
      pendingPhotoBlob = null;
      updateModalPhotoPreview();
    }

    /* --- Audio Recording & Voice Management --- */
    function updateModalAudioPreview() {
      const statusText = document.getElementById('audio-status-text');
      const recordingActive = document.getElementById('audio-recording-active');
      const recordBtn = document.getElementById('btn-record-voice');
      const recordBtnText = document.getElementById('btn-record-text');
      const stopBtn = document.getElementById('btn-stop-record');
      const playBtn = document.getElementById('btn-play-preview');
      const removeBtn = document.getElementById('btn-remove-audio');

      recordingActive.style.display = 'none';
      stopBtn.style.display = 'none';
      recordBtn.style.display = 'inline-flex';

      if (pendingAudioBlob) {
        statusText.textContent = 'Voice recording ready (tap Play to test)';
        recordBtnText.textContent = 'Re-record Voice';
        playBtn.style.display = 'inline-flex';
        removeBtn.style.display = 'inline-flex';
      } else {
        statusText.textContent = 'No voice recording';
        recordBtnText.textContent = 'Record Voice';
        playBtn.style.display = 'none';
        removeBtn.style.display = 'none';
      }
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Microphone not supported in this browser.', 'error');
        return;
      }

      stopAudioPreview();

      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        let chosenMime = '';
        if (typeof MediaRecorder !== 'undefined') {
          const types = [
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/ogg;codecs=opus',
            'audio/aac'
          ];
          for (const t of types) {
            if (MediaRecorder.isTypeSupported(t)) {
              chosenMime = t;
              break;
            }
          }
        }

        mediaRecorder = new MediaRecorder(audioStream, chosenMime ? { mimeType: chosenMime } : undefined);
        recordedAudioChunks = [];
        recordMimeType = chosenMime;
        recordingFinalized = false;

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedAudioChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => finalizeRecording();
        mediaRecorder.onerror = (e) => {
          console.log('[TT] MediaRecorder error: ' + (e && e.error));
          finalizeRecording();
        };

        mediaRecorder.start(100);

        // UI state for recording
        document.getElementById('audio-status-text').style.display = 'none';
        document.getElementById('audio-recording-active').style.display = 'flex';
        document.getElementById('btn-record-voice').style.display = 'none';
        document.getElementById('btn-play-preview').style.display = 'none';
        document.getElementById('btn-remove-audio').style.display = 'none';
        document.getElementById('btn-stop-record').style.display = 'inline-flex';

        recordSecondsElapsed = 0;
        updateRecordingTimerUI();

        recordIntervalTimer = setInterval(() => {
          recordSecondsElapsed++;
          updateRecordingTimerUI();
        }, 1000);

        // Auto-stop at 15 seconds
        recordAutoStopTimer = setTimeout(() => {
          stopRecording();
        }, 15000);

      } catch (err) {
        stopAudioStream();
        updateModalAudioPreview();
        showToast('Microphone blocked — allow in browser settings', 'error');
      }
    }

    function updateRecordingTimerUI() {
      const mins = Math.floor(recordSecondsElapsed / 60);
      const secs = recordSecondsElapsed % 60;
      const formatted = `${mins}:${secs.toString().padStart(2, '0')}`;
      const timerEl = document.getElementById('recording-timer');
      if (timerEl) {
        timerEl.textContent = `Recording: ${formatted} / 0:15`;
      }
    }

    /*
     * MediaRecorder.stop() is asynchronous: it flushes a final 'dataavailable'
     * and only then fires 'onstop'. Tearing the source stream down in the same
     * tick kills the recorder before it dispatches 'onstop', so the blob never
     * gets assembled and the whole recording is silently discarded. Stop the
     * recorder here and let finalizeRecording() (from 'onstop') do the teardown.
     */
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        // Safety net in case 'onstop' never arrives: the chunks are already ours.
        clearTimeout(recordSafetyTimer);
        recordSafetyTimer = setTimeout(finalizeRecording, 1500);
      } else {
        finalizeRecording();
      }
    }

    /** Assembles the recorded chunks into pendingAudioBlob exactly once. */
    function finalizeRecording() {
      if (recordingFinalized) return;
      recordingFinalized = true;
      clearTimeout(recordSafetyTimer);
      recordSafetyTimer = null;

      const bytes = recordedAudioChunks.reduce((sum, c) => sum + c.size, 0);
      pendingAudioBlob = bytes > 0
        ? new Blob(recordedAudioChunks, { type: recordMimeType || 'audio/webm' })
        : null;

      stopRecordingTimer();
      stopAudioStream();
      updateModalAudioPreview();

      if (pendingAudioBlob) {
        console.log('[TT] recording finalized: ' + pendingAudioBlob.size + ' bytes, '
          + (recordMimeType || 'audio/webm'));
        showToast('Recording saved for tile!', 'success');
      } else {
        console.log('[TT] recording produced no audio data');
        showToast('Nothing was recorded — try again', 'error');
      }
    }

    function stopRecordingTimer() {
      if (recordIntervalTimer) {
        clearInterval(recordIntervalTimer);
        recordIntervalTimer = null;
      }
      if (recordAutoStopTimer) {
        clearTimeout(recordAutoStopTimer);
        recordAutoStopTimer = null;
      }
      const statusText = document.getElementById('audio-status-text');
      if (statusText) statusText.style.display = 'block';
    }

    function stopAudioStream() {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
    }

    function togglePlayAudioPreview() {
      if (!pendingAudioBlob) return;

      if (previewAudioPlayer) {
        stopAudioPreview();
        return;
      }

      const playIcon = document.getElementById('play-preview-icon');
      const playText = document.getElementById('play-preview-text');
      const audioUrl = URL.createObjectURL(pendingAudioBlob);
      const audio = new Audio(audioUrl);
      previewAudioPlayer = audio;

      playIcon.innerHTML = '<path d="M6 6h12v12H6z"/>';
      playText.textContent = 'Stop';

      const cleanup = () => {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playText.textContent = 'Play Test';
        URL.revokeObjectURL(audioUrl);
        previewAudioPlayer = null;
      };

      audio.onended = cleanup;
      audio.onerror = () => {
        cleanup();
        showToast('Playback error', 'error');
      };

      audio.play().catch(() => {
        cleanup();
        showToast('Could not play audio', 'error');
      });
    }

    function stopAudioPreview() {
      if (previewAudioPlayer) {
        previewAudioPlayer.pause();
        previewAudioPlayer.currentTime = 0;
        const playIcon = document.getElementById('play-preview-icon');
        const playText = document.getElementById('play-preview-text');
        if (playIcon) playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        if (playText) playText.textContent = 'Play Test';
        previewAudioPlayer = null;
      }
    }

    function removeAudio() {
      stopAudioPreview();
      pendingAudioBlob = null;
      updateModalAudioPreview();
    }

    /*
     * A tile tap opens the editor from 'pointerup'. Chrome then synthesises the
     * compatibility 'click' for that same touch ~10ms later and hit-tests it
     * against the DOM as it is BY THEN -- i.e. against the freshly opened modal.
     * That orphan click lands on whichever modal button happens to sit under the
     * finger (Cancel, or worse, Save), so the editor flashes open and instantly
     * dismisses itself. Swallow clicks inside the modal that never had a
     * matching pointerdown inside the modal; a real press always does.
     */
    function installModalClickGuard() {
      const modal = document.getElementById('editor-modal');

      modal.addEventListener('pointerdown', () => {
        modalPointerDownSeen = true;
      }, true);

      document.addEventListener('click', (e) => {
        if (!modal.classList.contains('open')) return;
        if (modalPointerDownSeen) return;
        if (performance.now() - editorOpenedAt > 1000) return;
        if (!modal.contains(e.target)) return;
        console.log('[TT] swallowed orphan click on ' + (e.target.textContent || '').trim().slice(0, 20));
        e.preventDefault();
        e.stopPropagation();
      }, true);
    }

    /* --- Application Initialization --- */
    async function initApp() {
      // Load stored preferences
      const savedLayout = parseInt(localStorage.getItem('aac_layout'), 10);
      if (savedLayout === 1 || savedLayout === 2 || savedLayout === 3) {
        currentLayout = savedLayout;
      }

      // Pinning is live OS state, never restored from storage. Clear the flag
      // older builds wrote so an upgrade can't come back up looking locked.
      localStorage.removeItem('aac_locked');
      isPinned = false;

      updateThemeClasses();
      applyLockState();
      installModalClickGuard();

      try {
        await loadAllTilesFromDB();
      } catch (err) {
        console.error('Failed to load tiles from IndexedDB', err);
      }

      renderBoard();

      /*
       * Warm the subject model in the background, after the board is up.
       *
       * Loading the runtime and the model is over a second of the wait, and it
       * only ever has to happen once per launch. Doing it now -- while the
       * user is still looking at the board deciding which tile to edit --
       * means that by the time a photo is taken the model is already sitting
       * there, and the wait is inference alone. Failure here is silent by
       * design: segLoad() records it and the editor falls back to the colour
       * pass without anyone being told about a model they never asked for.
       */
      if (window.TT_AI.enabled) {
        setTimeout(() => {
          segLoad().then((session) => {
            if (!session) return;
            // One throwaway inference so the WASM is compiled and the tensor
            // arenas are allocated before the first real photo needs them.
            const warm = document.createElement('canvas');
            warm.width = 8; warm.height = 8;
            const wctx = warm.getContext('2d');
            wctx.fillStyle = '#808080';
            wctx.fillRect(0, 0, 8, 8);
            segmentSubject(wctx.getImageData(0, 0, 8, 8))
              .then(() => console.log('[TT] subject model warm'))
              .catch(() => {});
          });
        }, 1200);
      }
    }

    // A rotation or any viewport change resizes every tile, so the labels have
    // to be measured again against their new boxes.
    window.addEventListener('resize', fitAllLabels);
    window.addEventListener('resize', () => { if (ED.src) edLayoutStage(); });
    window.addEventListener('orientationchange', () => setTimeout(fitAllLabels, 150));

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
